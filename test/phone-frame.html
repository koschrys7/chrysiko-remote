<!doctype html><meta charset="utf-8"><title>device frame</title>
<style>body{margin:0;background:#777}iframe{border:0;display:block;background:#fff}</style>
<iframe id="f"></iframe>
<script>
// ?w=440&h=956&q=slot=2%26open : renders index.html?demo&<q> at a device size, for screenshots.
const p = new URLSearchParams(location.search), f = document.getElementById("f");
f.style.width = (p.get("w") || 440) + "px"; f.style.height = (p.get("h") || 956) + "px";
f.src = "../index.html?demo" + (p.get("q") ? "&" + p.get("q") : "");
</script>
